[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "oil-uplift-prediction"
version = "0.1.0"
description = "Reproducible, configuration-driven competition framework for fracturing uplift prediction"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24,<3",
  "pandas>=2.0,<3",
  "scikit-learn>=1.3,<2",
  "PyYAML>=6.0,<7",
  "joblib>=1.3,<2",
  "openpyxl>=3.1,<4",
]

[project.optional-dependencies]
test = ["pytest>=7.4,<9"]

[project.scripts]
oil-uplift = "oil_uplift.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
